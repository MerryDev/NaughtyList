[versions]
resource-factory = "1.3.1"
run-server = "3.1.0"
velocity = "4.1.1-SNAPSHOT"

[libraries]
paper = { group = "io.papermc.paper", name = "paper-api", version = "26.2.build.+" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

[plugins]
bukkitConvention = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }
velocityConvention = { id = "xyz.jpenilla.resource-factory-velocity-convention", version.ref = "resource-factory" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "run-server" }
runVelocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-server" }
shadow = { id = "com.gradleup.shadow", version = "9.3.1" }

